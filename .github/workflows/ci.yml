name: Quality and security checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# One run at a time per ref. A new push to a pull request cancels its run in progress; on main,
# the run in progress always finishes and the latest push waiting behind it runs next.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: TypeScript and test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      RESEND_API_KEY: re_test_dummy_key_12345678
      STRIPE_SECRET_KEY: sk_test_51N9oXjDummyKeyForContinuousIntegration000000
      TURNSTILE_SECRET_KEY: 1x00000000000000000000AA
      CANDIDATE_AUTH_PEPPER: dummy_pepper_for_ci_testing_32_chars_long
      CANDIDATE_DOCUMENT_ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      JWT_SECRET: dummy_jwt_secret_for_ci_testing_32_chars_long
      GOOGLE_DRIVE_CLIENT_ID: dummy_client_id
      GOOGLE_DRIVE_CLIENT_SECRET: dummy_client_secret
      GOOGLE_DRIVE_CV_FOLDER_ID: dummy_ci_folder_id
      RUN_EXTERNAL_SECURITY_TESTS: "false"

    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify TypeScript
        run: pnpm check
      - name: Run test suite
        run: pnpm test:ci
      - name: Verify production build
        id: build
        run: pnpm build
      # The three checks below each run once the build has passed, even if one of them fails,
      # so a single run reports every regression.
      - name: Check performance budgets
        run: node scripts/check-performance-budgets.mjs
      - name: Start the built server
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/smoke-built-server.mjs
      - name: Verify migrations match the schema
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          node scripts/check-migrations-in-sync.mjs
          git diff --exit-code -- drizzle/pg
          untracked="$(git status --porcelain --untracked-files=all -- drizzle/pg)"
          if [ -n "$untracked" ]; then echo "$untracked"; exit 1; fi

  dependency-audit:
    name: Dependency vulnerability report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
